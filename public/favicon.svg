<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Base contenedora en modo oscuro -->
  <rect width="32" height="32" rx="7" fill="url(#bgGrad)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" stroke="#10b981" stroke-opacity="0.35" fill="none"/>
  
  <!-- Cilindro Base de Datos (PostgreSQL / Supabase) -->
  <ellipse cx="16" cy="9" rx="8.5" ry="3" fill="#047857" opacity="0.6"/>
  <ellipse cx="16" cy="8.5" rx="8.5" ry="2.8" fill="#10b981"/>
  
