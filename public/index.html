<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Supalive · Manual Técnico & Mantenedor Autónomo de Supabase</title>
  <meta name="description" content="Manual de ingeniería y mantenedor para operar en la capa gratuita de Supabase sin suspensiones por inactividad.">
  <!-- Google Fonts: JetBrains Mono & Plus Jakarta Sans & Syne -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  
  <!-- Silenciar aviso de Tailwind CDN en consola -->
  <script>
    const _origWarn = console.warn;
    console.warn = function(...args) {
      if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
      _origWarn.apply(console, args);
    };
  </script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Syne"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            supa: {
              400: '#34d399',
              500: '#10b981',
              600: '#059669'
            }
          },
          boxShadow: {
            'neon-emerald': '0 0 20px -3px rgba(16, 185, 129, 0.35)',
            'soft-card': '0 10px 30px -5px rgba(0, 0, 0, 0.05), 0 4px 12px -2px rgba(0, 0, 0, 0.03)'
          }
        }
      }
    }
  </script>
  <style>
    html, body {
      overflow-x: hidden;
      max-width: 100vw;
    }
    .neon-text {
      background: linear-gradient(135deg, #10b981 0%, #00f59b 50%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .pulse-glow {
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      animation: pulseGlow 2s infinite;
    }
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); }
      70% { box-shadow: 0 0 0 9px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Scrollbars visuales táctiles para tablas y bloques de código */
    .custom-scrollbar::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.1);
      border-radius: 9999px;
    }
    .dark .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(16, 185, 129, 0.4);
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(16, 185, 129, 0.75);
    }
    .table-scroll-container {
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
    }
    code:not(pre code) {
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    pre {
      max-width: 100%;
    }
  </style>

  <!-- Componentes Modulares -->
  <script src="/components/header.js"></script>
  <script src="/components/hero.js"></script>
  <script src="/components/manual.js"></script>
  <script src="/components/showcase.js"></script>
  <script src="/components/cloud.js"></script>
  <script src="/components/footer.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-[#070b14] dark:text-slate-100 min-h-screen flex flex-col font-sans antialiased transition-colors duration-300 selection:bg-emerald-500 selection:text-slate-950">

  <!-- Header Component (Fijo en Modo Oscuro) -->
  <div id="component-header"></div>

  <!-- Hero Component Modular (Centrado con fondo gradiente verde neon a violeta) -->
  <div id="component-hero"></div>

  <!-- Pestañas de Navegación -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex-1 w-full space-y-6 sm:space-y-8">
    
    <!-- Barra de Pestañas Segmentada & Responsiva (Diseñada para visualización perfecta en móviles y pantallas grandes) -->
    <nav aria-label="Navegación de Secciones" class="w-full">
      <div class="grid grid-cols-3 gap-1 p-1 sm:p-1.5 bg-slate-200/80 dark:bg-slate-900/90 rounded-2xl border border-slate-300/60 dark:border-slate-800 shadow-sm w-full max-w-3xl mx-auto sm:mx-0">
        
        <button onclick="switchTab('manual')" id="tab-btn-manual" class="py-2.5 px-2 sm:px-5 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-1.5 sm:gap-2 transition-all duration-200 bg-white dark:bg-slate-800 text-emerald-600 dark:text-emerald-400 shadow-sm border border-slate-200/60 dark:border-slate-700/60 shrink-0">
          <svg class="w-4 h-4 text-emerald-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
          <span class="sm:hidden">Manual</span>
          <span class="hidden sm:inline">Manual Técnico & Guía</span>
        </button>

        <button onclick="switchTab('showcase')" id="tab-btn-showcase" class="py-2.5 px-2 sm:px-5 rounded-xl text-xs sm:text-sm font-medium flex items-center justify-center gap-1.5 sm:gap-2 transition-all duration-200 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-white/40 dark:hover:bg-slate-800/40 border border-transparent shrink-0">
          <svg class="w-4 h-4 text-slate-400 dark:text-slate-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
          <span class="sm:hidden">Monitor</span>
          <span class="hidden sm:inline">Monitor en Vivo</span>
        </button>

        <button onclick="switchTab('cloud')" id="tab-btn-cloud" class="py-2.5 px-2 sm:px-5 rounded-xl text-xs sm:text-sm font-medium flex items-center justify-center gap-1.5 sm:gap-2 transition-all duration-200 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-white/40 dark:hover:bg-slate-800/40 border border-transparent shrink-0">
          <svg class="w-4 h-4 text-slate-400 dark:text-slate-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 00-9.78 2.096A4.001 4.001 0 003 15z"/></svg>
          <span class="sm:hidden">Auditoría</span>
          <span class="hidden sm:inline">Auditoría Cloud (GitHub)</span>
        </button>

      </div>
    </nav>

    <!-- Pestaña 1: Manual Técnico -->
    <div id="tab-manual">
      <div id="component-manual"></div>
    </div>

    <!-- Pestaña 2: Showcase / Monitor en Vivo -->
    <div id="tab-showcase" class="hidden">
      <div id="component-showcase"></div>
    </div>

    <!-- Pestaña 3: Auditoría Cloud -->
    <div id="tab-cloud" class="hidden">
      <div id="component-cloud"></div>
    </div>

  </main>

  <!-- Footer Component (Fijo en Modo Oscuro) -->
  <div id="component-footer"></div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-4 sm:bottom-6 right-4 sm:right-6 z-50 flex flex-col space-y-2 pointer-events-none max-w-[90vw]"></div>

  <!-- Orquestador Principal de Estado -->
  <script>
    let stateProjects = [];
    let stateCloud = null;
    const STORAGE_KEY_PINGS = 'supalive_last_pings';
    const STORAGE_KEY_THEME = 'supalive_theme';

    // Theme Management
    function initTheme() {
      const savedTheme = localStorage.getItem(STORAGE_KEY_THEME) || 'dark';
      if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
      }
      updateThemeIcons();
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.contains('dark');
      if (isDark) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem(STORAGE_KEY_THEME, 'light');
      } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem(STORAGE_KEY_THEME, 'dark');
      }
      updateThemeIcons();
      // Re-render components that might have dynamic theme elements
      renderShowcaseComponent();
    }

    function updateThemeIcons() {
      const isDark = document.documentElement.classList.contains('dark');
      const sunIcon = document.getElementById('theme-sun-icon');
      const moonIcon = document.getElementById('theme-moon-icon');
      if (sunIcon && moonIcon) {
        if (isDark) {
          sunIcon.classList.remove('hidden');
          moonIcon.classList.add('hidden');
        } else {
          sunIcon.classList.add('hidden');
          moonIcon.classList.remove('hidden');
        }
      }
    }

    // Almacenamiento local persistente de latidos
    function getStoredPings() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY_PINGS) || '{}');
      } catch (e) {
        return {};
      }
    }

    function saveStoredPing(projectId, projectName, pingData) {
      const pings = getStoredPings();
      const data = {
        ...pingData,
        timestamp: pingData.timestamp || new Date().toISOString()
      };
      if (projectId) pings[projectId] = data;
      if (projectName) {
        const key = 'name_' + projectName.toLowerCase().trim().replace(/[^a-z0-9]/g, '');
        pings[key] = data;
      }
      localStorage.setItem(STORAGE_KEY_PINGS, JSON.stringify(pings));
    }

    // Control de pestañas responsivo
    function switchTab(tabId) {
      const activeClass = 'py-2.5 px-2 sm:px-5 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-1.5 sm:gap-2 transition-all duration-200 bg-white dark:bg-slate-800 text-emerald-600 dark:text-emerald-400 shadow-sm border border-slate-200/60 dark:border-slate-700/60 shrink-0';
      const inactiveClass = 'py-2.5 px-2 sm:px-5 rounded-xl text-xs sm:text-sm font-medium flex items-center justify-center gap-1.5 sm:gap-2 transition-all duration-200 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-white/40 dark:hover:bg-slate-800/40 border border-transparent shrink-0';

      ['manual', 'showcase', 'cloud'].forEach(t => {
        const content = document.getElementById(`tab-${t}`);
        const btn = document.getElementById(`tab-btn-${t}`);
        const icon = btn ? btn.querySelector('svg') : null;

        if (t === tabId) {
          content.classList.remove('hidden');
          btn.className = activeClass;
          if (icon) {
            icon.classList.remove('text-slate-400', 'dark:text-slate-500');
            icon.classList.add('text-emerald-500');
          }
        } else {
          content.classList.add('hidden');
          btn.className = inactiveClass;
          if (icon) {
            icon.classList.remove('text-emerald-500');
            icon.classList.add('text-slate-400', 'dark:text-slate-500');
          }
        }
      });
    }

    // Utilidad de copiado al portapapeles para bloques de código
    function copyCode(buttonEl, codeId) {
      const codeEl = document.getElementById(codeId);
      if (!codeEl) return;
      const textToCopy = codeEl.innerText.trim();
      navigator.clipboard.writeText(textToCopy).then(() => {
        const originalContent = buttonEl.innerHTML;
        buttonEl.innerHTML = `<span class="text-emerald-400 font-bold">¡Copiado! ✓</span>`;
        showToast('Código copiado al portapapeles', 'success');
        setTimeout(() => {
          buttonEl.innerHTML = originalContent;
        }, 2200);
      }).catch(() => {
        showToast('No se pudo copiar automáticamente', 'error');
      });
    }

    // Renderizado de componentes
    function renderShowcaseComponent() {
      renderShowcase('component-showcase', stateProjects, getStoredPings());
    }

    // Fetch de proyectos
    async function fetchProjects() {
      try {
        const res = await fetch('/api/projects');
        if (res.ok) {
          stateProjects = await res.json();
          document.getElementById('hero-total-count').innerText = stateProjects.length;
          renderShowcaseComponent();
        }
      } catch (err) {
        console.error('Error al cargar proyectos:', err);
      }
    }

    // Ping individual
    async function pingSingleProject(id, buttonEl) {
      if (buttonEl) {
        buttonEl.disabled = true;
        buttonEl.innerHTML = `<svg class="w-3.5 h-3.5 animate-spin text-emerald-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" stroke-opacity="0.25"/><path d="M12 2a10 10 0 0110 10" stroke-linecap="round"/></svg><span>Enviando...</span>`;
      }

      showToast('Enviando latido a Supabase...', 'info');

      try {
        const res = await fetch(`/api/projects/${id}/ping`, { method: 'POST' });
        const data = await res.json();
        if (res.ok && data.result) {
          saveStoredPing(id, data.result.projectName, data.result);
          renderShowcaseComponent();
          showToast(`¡Latido exitoso! (${data.result.latencyMs} ms · HTTP ${data.result.httpStatus})`, 'success');
        } else {
          showToast(data.error || 'Error al enviar latido', 'error');
        }
      } catch (err) {
        showToast('Error de red al conectar con Supabase', 'error');
      } finally {
        if (buttonEl) buttonEl.disabled = false;
      }
    }

    // Ping a todos
    async function pingAllProjects() {
      const btn = document.getElementById('btn-ping-all');
      const btnText = document.getElementById('btn-ping-all-text');
      const btnTextMobile = document.getElementById('btn-ping-all-text-mobile');
      btn.disabled = true;
      if (btnText) btnText.innerText = 'Enviando...';
      if (btnTextMobile) btnTextMobile.innerText = '...';
      showToast('Enviando latido a todas las bases de datos...', 'info');

      try {
        const res = await fetch('/api/ping-all', { method: 'POST' });
        const data = await res.json();
        if (res.ok && data.results) {
          data.results.forEach(r => {
            saveStoredPing(r.projectId, r.projectName, r);
          });
          renderShowcaseComponent();
          showToast(`¡Latidos completados! ${data.summary.success} bases de datos verificadas.`, 'success');
        } else {
          showToast(data.error || 'Error durante el latido masivo', 'error');
        }
      } catch (err) {
        showToast('Error de conexión', 'error');
      } finally {
        btn.disabled = false;
        if (btnText) btnText.innerText = 'Latido a Todos';
        if (btnTextMobile) btnTextMobile.innerText = 'Latido';
      }
    }

    // Consulta de GitHub Actions Cloud
    async function fetchCloudStatus() {
      try {
        const res = await fetch('/api/github/runs');
        stateCloud = await res.json();
        renderCloud('component-cloud', stateCloud);

        const heroLast = document.getElementById('hero-cloud-last');
        if (heroLast && stateCloud && stateCloud.latestRun) {
          heroLast.innerHTML = `
            <span class="text-emerald-600 dark:text-emerald-400 font-bold">✓ Éxito</span> 
            <span class="text-xs text-slate-500 dark:text-slate-400 font-normal">(${new Date(stateCloud.latestRun.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })})</span>
          `;
        }
      } catch (err) {
        console.error('Error al consultar nube:', err);
      }
    }

    // Notificaciones Toast
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      
      const colors = {
        success: 'bg-emerald-950/95 border-emerald-500/50 text-emerald-200',
        error: 'bg-red-950/95 border-red-500/50 text-red-200',
        info: 'bg-slate-900/95 border-slate-700 text-white'
      };

      toast.className = `pointer-events-auto px-4 py-3 rounded-2xl border text-xs font-mono font-medium shadow-2xl backdrop-blur-xl flex items-center gap-2 transform transition-all duration-300 translate-y-2 opacity-0 ${colors[type] || colors.info}`;
      toast.innerHTML = `<span>${escapeHtml(message)}</span>`;
      
      container.appendChild(toast);
      setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Inicialización al cargar el DOM
    window.addEventListener('DOMContentLoaded', () => {
      renderHeader('component-header');
      renderHero('component-hero');
      renderManual('component-manual');
      renderCloud('component-cloud', null);
      renderFooter('component-footer');
      
      initTheme();
      fetchProjects();
      fetchCloudStatus();
    });
  </script>
</body>
</html>
